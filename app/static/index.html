<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Task Planner - Умный планировщик задач</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Хедер */
        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        /* Карточки */
        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        /* Форма */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        /* Таблица задач */
        .task-table {
            width: 100%;
            border-collapse: collapse;
        }

        .task-table th,
        .task-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }

        .task-table th {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-weight: 600;
        }

        .task-table tr:hover {
            background: #f5f5f5;
        }

        /* Бейджи категорий */
        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-work { background: #ff4757; color: white; }
        .badge-personal { background: #00b894; color: white; }
        .badge-health { background: #0984e3; color: white; }
        .badge-learning { background: #fdcb6e; color: #333; }
        .badge-other { background: #95a5a6; color: white; }

        .badge-pending { background: #ffa502; color: white; }
        .badge-done { background: #2ed573; color: white; }

        /* Кнопки действий */
        .action-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            margin: 0 5px;
            padding: 5px 8px;
        }

        .delete-btn { color: #ff4757; }
        .complete-btn { color: #00b894; }

        /* Статистика */
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
        }

        .stat-card h3 {
            font-size: 2em;
            margin-bottom: 5px;
        }

        /* Анимация загрузки */
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .stats {
                grid-template-columns: 1fr;
            }
            .task-table {
                font-size: 12px;
            }
            .task-table th,
            .task-table td {
                padding: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📋 Smart Task Planner</h1>
            <p>Умный планировщик с AI-помощником 🤖</p>
        </div>

        <!-- Статистика -->
        <div class="stats">
            <div class="stat-card">
                <h3 id="totalTasks">0</h3>
                <p>Всего задач</p>
            </div>
            <div class="stat-card">
                <h3 id="pendingTasks">0</h3>
                <p>В работе</p>
            </div>
            <div class="stat-card">
                <h3 id="completedTasks">0</h3>
                <p>Выполнено</p>
            </div>
        </div>

        <!-- Форма создания задачи -->
        <div class="card">
            <h2>➕ Новая задача</h2>
            <form id="taskForm">
                <div class="form-group">
                    <label>Название задачи *</label>
                    <input type="text" id="title" required placeholder="Например: Сдать проект">
                </div>
                <div class="form-group">
                    <label>Описание</label>
                    <textarea id="description" placeholder="Подробности задачи..."></textarea>
                </div>
                <div class="form-group">
                    <label>Категория (необязательно, AI определит сам)</label>
                    <select id="category">
                        <option value="">🤖 Авто (AI)</option>
                        <option value="работа">💼 Работа</option>
                        <option value="личное">🏠 Личное</option>
                        <option value="здоровье">💪 Здоровье</option>
                        <option value="обучение">📚 Обучение</option>
                        <option value="другое">🎲 Другое</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Время (минут, необязательно, AI оценит сам)</label>
                    <input type="number" id="estimated_minutes" placeholder="Например: 30">
                </div>
                <button type="submit">✨ Создать задачу</button>
            </form>
        </div>

        <!-- Список задач -->
        <div class="card">
            <h2>📝 Мои задачи</h2>
            <div class="loading" id="loading">
                <div class="spinner"></div>
            </div>
            <div id="tasksList">
                <table class="task-table">
                    <thead>
                        <tr><th>Название</th><th>Описание</th><th>Категория</th><th>Время</th><th>Статус</th><th>Действия</th></tr>
                    </thead>
                    <tbody id="tasksBody">
                        <tr><td colspan="6" style="text-align: center;">Загрузка...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000/api/v1/tasks';
        
        // Загрузка задач при открытии страницы
        document.addEventListener('DOMContentLoaded', () => {
            loadTasks();
        });

        // Обработка формы
        document.getElementById('taskForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const taskData = {
                title: document.getElementById('title').value,
                description: document.getElementById('description').value || "",
                category: document.getElementById('category').value || null,
                estimated_minutes: document.getElementById('estimated_minutes').value ?
                    parseInt(document.getElementById('estimated_minutes').value) : null
            };

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(taskData)
                });

                if (response.ok) {
                    document.getElementById('taskForm').reset();
                    loadTasks();
                    showNotification('✅ Задача создана!', 'success');
                }
            } catch (error) {
                showNotification('❌ Ошибка при создании задачи', 'error');
            }
        });

        // Загрузка всех задач
        async function loadTasks() {
            showLoading(true);
            try {
                const response = await fetch(API_URL);
                const tasks = await response.json();
                displayTasks(tasks);
                updateStats(tasks);
            } catch (error) {
                console.error('Ошибка:', error);
                document.getElementById('tasksBody').innerHTML =
                    '<tr><td colspan="6" style="text-align: center; color: red;">❌ Ошибка загрузки задач</td></tr>';
            }
            showLoading(false);
        }

        // Отображение задач
        function displayTasks(tasks) {
            if (!tasks || tasks.length === 0) {
                document.getElementById('tasksBody').innerHTML =
                    '<tr><td colspan="6" style="text-align: center;">🎉 Нет задач, отдохни!</td></tr>';
                return;
            }

            const categoryIcons = {
                'работа': '💼', 'личное': '🏠', 'здоровье': '💪', 'обучение': '📚', 'другое': '🎲'
            };

            document.getElementById('tasksBody').innerHTML = tasks.map(task => `
                <tr>
                    <td><strong>${escapeHtml(task.title)}</strong></td>
                    <td>${escapeHtml(task.description || '-')}</td>
                    <td><span class="badge badge-${getCategoryClass(task.category)}">${categoryIcons[task.category] || '📌'} ${task.category}</span></td>
                    <td>${task.estimated_minutes} мин</td>
                    <td><span class="badge badge-${task.status === 'done' ? 'done' : 'pending'}">${task.status === 'done' ? '✅ Выполнено' : '⏳ В работе'}</span></td>
                    <td>
                        ${task.status !== 'done' ? `<button class="action-btn complete-btn" onclick="completeTask(${task.id})" title="Выполнить">✅</button>` : ''}
                        <button class="action-btn delete-btn" onclick="deleteTask(${task.id})" title="Удалить">🗑️</button>
                    </td>
                </tr>
            `).join('');
        }

        function getCategoryClass(category) {
            const map = {'работа': 'work', 'личное': 'personal', 'здоровье': 'health', 'обучение': 'learning', 'другое': 'other'};
            return map[category] || 'other';
        }

        // Выполнение задачи
        async function completeTask(id) {
            try {
                const response = await fetch(`${API_URL}/${id}`);
                const task = await response.json();

                task.status = 'done';
                const updateResponse = await fetch(`${API_URL}/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(task)
                });

                if (updateResponse.ok) {
                    loadTasks();
                    showNotification('🎉 Задача выполнена!', 'success');
                }
            } catch (error) {
                showNotification('Ошибка', 'error');
            }
        }

        // Удаление задачи
        async function deleteTask(id) {
            if (confirm('Точно удалить задачу?')) {
                try {
                    const response = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                    if (response.ok) {
                        loadTasks();
                        showNotification('🗑️ Задача удалена', 'success');
                    }
                } catch (error) {
                    showNotification('Ошибка удаления', 'error');
                }
            }
        }

        // Обновление статистики
        function updateStats(tasks) {
            document.getElementById('totalTasks').textContent = tasks.length;
            document.getElementById('pendingTasks').textContent = tasks.filter(t => t.status !== 'done').length;
            document.getElementById('completedTasks').textContent = tasks.filter(t => t.status === 'done').length;
        }

        // Вспомогательные функции
        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
        }

        function showNotification(msg, type) {
            const notification = document.createElement('div');
            notification.textContent = msg;
            notification.style.cssText = `
                position: fixed;
                bottom: 20px;
                right: 20px;
                background: ${type === 'success' ? '#00b894' : '#ff4757'};
                color: white;
                padding: 12px 20px;
                border-radius: 8px;
                z-index: 1000;
                animation: slideIn 0.3s ease;
            `;
            document.body.appendChild(notification);
            setTimeout(() => notification.remove(), 3000);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Добавляем CSS анимацию
        const style = document.createElement('style');
        style.textContent = `
            @keyframes slideIn {
                from { transform: translateX(100%); opacity: 0; }
                to { transform: translateX(0); opacity: 1; }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
